[project]
name = "browserforge"
version = "0.1.0"
description = "Config-driven browser automation dashboard: YAML recipes run by Playwright"
readme = "README.md"
authors = [
    { name = "Aksh Nishar", email = "83901599+aksh-nishar@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "playwright>=1.63.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
browserforge = "browserforge.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.9",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m unit"
markers = [
    "unit: fast tests, no browser/network (default)",
    "integration: real Playwright against real pages (run manually)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src:tests"
explicit_package_bases = true
